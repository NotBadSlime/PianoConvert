name: Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version like 1.0.0 or 1.0.0-beta.1 (without v prefix)"
        required: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: pip install "setuptools>=65,<81"
      - run: pip install --ignore-requires-python --no-deps homr==0.7.0
      - run: pip install --no-deps transkun==2.0.1
      - run: pip install musicxml==1.4 "opencv-python-headless>=4.10,<4.13" "pypdfium2>=4,<6" "rapidocr>=3.7,<4"
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  installer:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_INPUT: ${{ github.event.inputs.version }}
        run: |
          python scripts/resolve_release_version.py --event-name "$env:RELEASE_EVENT" --ref-name "$env:RELEASE_REF" --input-version "$env:RELEASE_INPUT" --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw "Invalid release version" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pip install "setuptools>=65,<81"
      - run: pip install --ignore-requires-python --no-deps homr==0.7.0
      - run: pip install --no-deps transkun==2.0.1
      - run: pip install musicxml==1.4 "opencv-python-headless>=4.10,<4.13" "pypdfium2>=4,<6" "rapidocr>=3.7,<4"
      - name: Download piano model
        shell: pwsh
        run: .\scripts\download_model.ps1 -Output "models\note_F1=0.9677_pedal_F1=0.9186.pth"
      - run: PyInstaller app.spec --noconfirm
      - name: Smoke test frozen app
        shell: pwsh
        run: .\scripts\verify_frozen.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }
          & $iscc /DMyAppVersion=${{ steps.version.outputs.plain }} /DMyAppNumericVersion=${{ steps.version.outputs.numeric }} installer\PianoConvert.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Installer checksum
        shell: pwsh
        run: |
          $file = Get-Item "installer/output/PianoConvertSetup-${{ steps.version.outputs.plain }}.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii "installer/output/SHA256SUMS.txt"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PianoConvert ${{ steps.version.outputs.plain }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installer/output/PianoConvertSetup-${{ steps.version.outputs.plain }}.exe
            installer/output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
