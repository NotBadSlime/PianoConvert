name: Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version like 0.2.0 (without v prefix)"
        required: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: pip install "setuptools>=65,<81"
      - run: pip install --ignore-requires-python --no-deps homr==0.7.0
      - run: pip install musicxml==1.4 "opencv-python-headless>=4.10,<4.13" "pypdfium2>=4,<6" "rapidocr>=3.7,<4"
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  installer:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}".TrimStart("v")
          } else {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          "value=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT
      - run: pip install -r requirements.txt pyinstaller
      - run: pip install "setuptools>=65,<81"
      - run: pip install --ignore-requires-python --no-deps homr==0.7.0
      - run: pip install musicxml==1.4 "opencv-python-headless>=4.10,<4.13" "pypdfium2>=4,<6" "rapidocr>=3.7,<4"
      - name: Download piano model
        shell: pwsh
        run: .\scripts\download_model.ps1 -Output "models\note_F1=0.9677_pedal_F1=0.9186.pth"
      - run: PyInstaller app.spec --noconfirm
      - name: Smoke test frozen app
        shell: pwsh
        run: .\scripts\verify_frozen.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }
          & $iscc /DMyAppVersion=${{ steps.version.outputs.value }} installer\PianoConvert.iss
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: installer/output/PianoConvertSetup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
